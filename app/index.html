<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/favor-icon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FavorOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-500.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f4efe0" />
    <style>html,body{background:#f4efe0}</style>
    <script>
      // The menu opens the way this person left it (slim rail or full sidebar) before the first frame, the same switch the classic pages use.
      try { var np = JSON.parse(localStorage.getItem('favor.hub.nav.prefs.v1') || '{}'); var nu = JSON.parse(localStorage.getItem('favor.hub.nav.v1') || 'null'); var pr = np[(nu && nu.user && nu.user.email) || '_'] || np._ || {}; if (pr.wide && matchMedia('(min-width: 1280px)').matches) document.documentElement.classList.add('nav-wide'); } catch (e) {}
      // The width a scrollbar takes on this computer (0 on a Mac or a tablet), for pages that fill the window (night-desk.css).
      try { var d = document.createElement('div'); d.style.cssText = 'position:absolute;top:-99px;width:50px;height:50px;overflow:scroll'; document.documentElement.appendChild(d); document.documentElement.style.setProperty('--sbw', (d.offsetWidth - d.clientWidth) + 'px'); d.remove(); } catch (e) {}
      // Focus rings are for the keyboard.
      (function () { var r = document.documentElement; addEventListener('keydown', function (e) { if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) r.classList.add('kbd'); }, true); addEventListener('pointerdown', function () { r.classList.remove('kbd'); }, true); })();
    </script>
    <script>
      // Ask for the first screen's answers now, in parallel with the bundle (lib/early.ts takes them). One request each, same headers as the app's own.
      (function () {
        var E = (window.__early = {});
        function go(path) { try { E[path] = { at: Date.now(), p: fetch(path, { credentials: 'same-origin', headers: { 'X-Hub-Request': '1' } }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }) }; } catch (e) {} }
        if (location.pathname === '/') {
          go('/api/hub/nav'); go('/api/hub/today'); go('/api/hub/day');
          try { var n = JSON.parse(localStorage.getItem('favor.hub.nav.v1') || 'null'); if (n && n.access && n.access.kpi) go('/api/hub/kpi'); } catch (e) {}
        } else go('/api/hub/nav');
      })();
    </script>
    <title>FavorOS</title>
  </head>
  <body class="h-body">
    <div id="root"><div class="h-app" id="h-app"><aside class="h-side" aria-hidden="true"></aside><div class="h-main"><header class="h-top"><div class="h-top__head"><div class="h-top__title">Today</div></div></header><main id="h-content" class="h-page"><div class="r2t"><div class="r2t-hello"><section class="h-hello"><h1 id="t-hello">Good day</h1><p>&nbsp;</p></section></div><section><div class="r2t-sec"><h2>Needs you</h2></div><div class="r2t-needs"><div class="r2t-skel"></div><div class="r2t-skel"></div><div class="r2t-skel"></div><div class="r2t-skel"></div></div></section></div></main></div></div></div>
    <script>try{var h=+new Date().toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',hour12:false})%24,p=h<12?'Good morning':h<17?'Good afternoon':'Good evening',n=localStorage.getItem('favor.hub.first.v1')||'';document.getElementById('t-hello').textContent=n?p+', '+n:p;}catch(e){}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
