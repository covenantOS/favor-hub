# Favor Hub (dash.favorintl.org)
# GitHub: covenantOS/favor-hub. Local: C:\Users\Willb\Claude\favor-hub
# Static Astro + Pages Functions. D1/R2 live on the Marketing account
# (same account as this Pages project). Do not bind Daniel's Tech-account
# RE NXT database; D1 bindings are same-account only.

name = "favor-hub"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "favor-requests"
database_id = "56466fae-d166-4010-9f7f-b8f2d8b50c8b"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "favor-requests"

# Gift entry: check and slip photos. Private; no public domain. The hub serves a photo only to a signed-in admin.
[[r2_buckets]]
binding = "GIFT_CAPTURES"
bucket_name = "favor-gift-captures"

# Clips (screen recordings): a private bucket, read only through /api/clips/<id>/media.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "favor-clips"

# Google sign-in for the whole hub (functions/_middleware.ts). "off" leaves pages open and the old
# per-app codes working; "on" sends everyone through /login with their @favorintl.org account.
[vars]
HUB_SIGNIN = "on"
GOOGLE_CLIENT_ID = "538890082341-5ka1icfropum9nl9csq8adaiusbuesea.apps.googleusercontent.com"

# Workers AI sorts "Make a request" between Will's board, the Marketing team and expense requests.
[ai]
binding = "AI"

# The KPI dashboard Worker: the hub reads its numbers and hands people over to it (/api/kpi/enter).
[[services]]
binding = "KPI"
service = "kpi-dashboard"

# Admin > Overview reads these, never writes them: the Drive library job's state, the unsubscribe write-back queue, and the
# upkeep route's call counter (Admin > Work Center also saves the daily cap, the key bb:ops:cap, there).
[[d1_databases]]
binding = "DRIVE_DB"
database_name = "favor-drive"
database_id = "d915f036-8825-4c6d-a3a6-f461fd86e58d"

[[d1_databases]]
binding = "MARKETING_DB"
database_name = "favor-marketing-db"
database_id = "bb2c7ff8-a8e3-4661-9418-a0cb55dca5db"

[[kv_namespaces]]
binding = "BB_KV"
id = "3510f9c623df4bd3a06d420b5d1e9160"
