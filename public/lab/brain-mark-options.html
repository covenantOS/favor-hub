:root {
  --canvas: #f3f1ea; --sunk: #ebe8de; --line: #e4e0d4; --line-2: #d3cdbd;
  --ink: #1d211b; --ink-2: #464c42; --ink-3: #666b60; --rail: #15231a;
  --serif: "Playfair Display", ui-serif, Georgia, serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sunk); color: var(--ink); font: 400 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 24px; }
@media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 12px; } }

.card { background: var(--canvas); border: 1px solid var(--line-2); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.card > header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.ltr { width: 32px; height: 32px; border-radius: 50%; background: var(--rail); color: #f3f1ea; font: 600 15px/32px var(--sans); text-align: center; flex: none; }
.card h2 { margin: 0; font: 500 22px/1.15 var(--serif); letter-spacing: -.01em; }

.start { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 16px 36px; }
.start h1 { margin: 22px 0 0; font: 500 38px/1.1 var(--serif); letter-spacing: -.015em; }
@media (max-width: 1280px) { .start h1 { font-size: 32px; } }
@media (max-width: 720px) { .start h1 { font-size: 30px; } }

.row2 { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.hd { display: flex; align-items: center; gap: 12px; padding: 0 20px; min-width: 0; }
.tile { width: 40px; height: 40px; border-radius: 12px; background: #e9e5f4; display: grid; place-items: center; flex: none; }
.ttl { font: 500 21px/1 var(--serif); letter-spacing: -.01em; white-space: nowrap; }
.tb { background: var(--rail); display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; height: 68px; padding: 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 600 11px/1 var(--sans); color: #8d9a8f; }
.tab svg { width: 24px; height: 24px; display: block; }
.tab.on { color: #fff; }

.think { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-top: 1px solid var(--line); color: var(--ink-2); font: 500 15px/1 var(--sans); }

.states { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: auto; }
.states figure { margin: 0; padding: 22px 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.states figure + figure { border-left: 1px solid var(--line); }
.states figcaption { font: 600 11px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- marks ---------- */
.mk { position: relative; display: block; width: var(--s); height: var(--s); font-size: var(--s); line-height: 0; flex: none; }
.mk i, .mk svg { position: absolute; display: block; }
.mk .in { inset: 0; }

/* shared state motion on the inner wrapper */
.mk[data-state=thinking] .in { animation: mk-think 1.9s ease-in-out infinite; }
.mk[data-state=answered] .in { animation: mk-ans 3.4s cubic-bezier(.2, .8, .2, 1) infinite; }
@keyframes mk-think { 50% { transform: scale(1.055); } }
@keyframes mk-ans { 0% { transform: scale(.84); } 12% { transform: scale(1.06); } 22%, 100% { transform: scale(1); } }

/* ---------- A B C: living orbs ---------- */
.orb .gl { inset: -14%; border-radius: 50%; background: radial-gradient(closest-side, var(--shd) 52%, var(--shd0) 100%); transform: translateY(9%) scale(.9); }
.orb .bd { inset: 0; border-radius: 50%; overflow: hidden; background: var(--base); isolation: isolate; transform: translateZ(0); }
.orb .bl { left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; will-change: transform; }
.orb .b1 { background: radial-gradient(closest-side, var(--c1) 0, var(--c1m) 42%, var(--c1z) 100%); transform: rotate(0deg) translate(-24%, -20%) scale(1.5); animation: ob1 var(--t1, 24s) linear infinite; }
.orb .b2 { background: radial-gradient(closest-side, var(--c2) 0, var(--c2m) 50%, var(--c2z) 100%); transform: rotate(0deg) translate(30%, 24%) scale(1.3); animation: ob2 var(--t2, 33s) linear infinite; }
.orb .b3 { background: radial-gradient(closest-side, var(--c3) 0, var(--c3m) 50%, var(--c3z) 100%); transform: rotate(0deg) translate(4%, 44%) scale(1.25); animation: ob3 var(--t3, 28s) linear infinite; }
@keyframes ob1 { 0% { transform: rotate(0deg) translate(-24%, -20%) scale(1.5); } 33% { transform: rotate(120deg) translate(-14%, -30%) scale(1.7); } 66% { transform: rotate(240deg) translate(-30%, -12%) scale(1.35); } 100% { transform: rotate(360deg) translate(-24%, -20%) scale(1.5); } }
@keyframes ob2 { 0% { transform: rotate(0deg) translate(30%, 24%) scale(1.3); } 33% { transform: rotate(-120deg) translate(22%, 36%) scale(1.5); } 66% { transform: rotate(-240deg) translate(38%, 16%) scale(1.15); } 100% { transform: rotate(-360deg) translate(30%, 24%) scale(1.3); } }
@keyframes ob3 { 0% { transform: rotate(0deg) translate(4%, 44%) scale(1.25); } 50% { transform: rotate(180deg) translate(-10%, 38%) scale(1.45); } 100% { transform: rotate(360deg) translate(4%, 44%) scale(1.25); } }
.orb[data-state=thinking] { --t1: 3.1s; --t2: 4.3s; --t3: 3.7s; }
.orb .sn { inset: 0; background: radial-gradient(ellipse 44% 32% at 33% 21%, var(--hi) 0, rgba(255, 255, 255, 0) 100%), radial-gradient(ellipse 52% 26% at 62% 96%, var(--bounce) 0, rgba(255, 255, 255, 0) 100%); }
.orb .rm { inset: 0; border-radius: 50%; background: radial-gradient(circle at 42% 38%, var(--rim0) 46%, var(--rim) 78%); }

.orb-a { --base: radial-gradient(circle at 36% 30%, #4a8f40 0, #2f5f2a 48%, #1c3a19 100%);
  --c1: #f4cb62; --c1m: rgba(214, 208, 98, .72); --c1z: rgba(150, 196, 96, 0);
  --c2: rgba(134, 206, 122, .95); --c2m: rgba(110, 184, 100, .5); --c2z: rgba(90, 160, 80, 0);
  --c3: rgba(22, 52, 22, .9); --c3m: rgba(26, 60, 24, .5); --c3z: rgba(30, 70, 28, 0);
  --hi: rgba(255, 255, 255, .62); --bounce: rgba(250, 230, 150, .22); --rim0: rgba(10, 32, 12, 0); --rim: rgba(10, 32, 12, .5);
  --shd: rgba(28, 58, 25, .26); --shd0: rgba(28, 58, 25, 0); }
.dk .orb-a { --base: radial-gradient(circle at 36% 30%, #a5dc98 0, #6cb45f 50%, #3f8539 100%);
  --c2: rgba(206, 242, 196, .95); --c2m: rgba(170, 225, 158, .5); --c2z: rgba(140, 205, 128, 0);
  --c3: rgba(52, 120, 48, .9); --c3m: rgba(60, 130, 54, .5); --c3z: rgba(70, 140, 60, 0);
  --rim: rgba(20, 60, 22, .42); --rim0: rgba(20, 60, 22, 0); --shd: rgba(0, 0, 0, 0); --shd0: rgba(0, 0, 0, 0); }

.orb-b { --base: radial-gradient(circle at 36% 30%, #e88f5e 0, #cf6540 48%, #a8442b 100%);
  --c1: #f8d470; --c1m: rgba(244, 184, 90, .72); --c1z: rgba(234, 150, 82, 0);
  --c2: rgba(255, 214, 170, .9); --c2m: rgba(246, 176, 122, .45); --c2z: rgba(232, 150, 100, 0);
  --c3: rgba(158, 58, 34, .9); --c3m: rgba(170, 68, 40, .5); --c3z: rgba(184, 80, 48, 0);
  --hi: rgba(255, 255, 255, .66); --bounce: rgba(255, 226, 170, .28); --rim0: rgba(110, 34, 14, 0); --rim: rgba(110, 34, 14, .46);
  --shd: rgba(160, 70, 40, .26); --shd0: rgba(160, 70, 40, 0); }
.dk .orb-b { --shd: rgba(0, 0, 0, 0); --shd0: rgba(0, 0, 0, 0); }

.orb-a .b3, .orb-b .b3 { z-index: -1; }
.orb-c { --base: radial-gradient(circle at 36% 28%, #ffffff 0, #f8f3e4 42%, #e3d9bf 100%);
  --c2: rgba(238, 190, 88, .8); --c2m: rgba(240, 204, 120, .36); --c2z: rgba(244, 222, 160, 0);
  --c3: rgba(150, 212, 138, .8); --c3m: rgba(170, 220, 160, .36); --c3z: rgba(190, 226, 180, 0);
  --hi: rgba(255, 255, 255, .95); --bounce: rgba(255, 255, 255, .5); --rim0: rgba(120, 98, 48, 0); --rim: rgba(120, 98, 48, .34);
  --shd: rgba(96, 80, 40, .24); --shd0: rgba(96, 80, 40, 0); }
.orb-c .bd { box-shadow: inset 0 0 0 .012em rgba(120, 100, 55, .3); }
.orb-c .b1 { background: radial-gradient(circle closest-side at 50% 50%, #58ad52 0, #3c8f3c 34%, #2c7532 58%, rgba(74, 150, 68, .55) 76%, rgba(150, 210, 138, 0) 100%); transform: translate(2%, 5%) scale(.66); animation: pc1 var(--t1, 7s) ease-in-out infinite; }
.orb-c .b2 { transform: rotate(0deg) translate(27%, -6%) scale(.4); animation: pc2 var(--t2, 19s) linear infinite; }
.orb-c .b3 { transform: rotate(0deg) translate(-27%, 12%) scale(.44); animation: pc3 var(--t3, 26s) linear infinite; }
@keyframes pc1 { 0%, 100% { transform: translate(2%, 5%) scale(.66); } 50% { transform: translate(-1%, 2%) scale(.8); } }
@keyframes pc2 { from { transform: rotate(0deg) translate(27%, -6%) scale(.4); } to { transform: rotate(360deg) translate(27%, -6%) scale(.4); } }
@keyframes pc3 { from { transform: rotate(0deg) translate(-27%, 12%) scale(.44); } to { transform: rotate(-360deg) translate(-27%, 12%) scale(.44); } }
.orb-c[data-state=thinking] { --t1: 1.7s; --t2: 2.6s; --t3: 3.4s; }
.dk .orb-c { --shd: rgba(0, 0, 0, 0); --shd0: rgba(0, 0, 0, 0); }

/* ---------- D: ring of light ---------- */
.ring { --r1: #e2a936; --r2: #efc95e; --r3: #58a550; --r4: #24521f; --glow: rgba(226, 169, 54, .3); --glow0: rgba(226, 169, 54, 0); --cm: rgba(255, 244, 200, .9); --cm0: rgba(255, 244, 200, 0); }
.dk .ring .lit { background: radial-gradient(closest-side, rgba(240, 195, 90, .3) 0, rgba(240, 195, 90, 0) 100%); }
.dk .ring { --r1: #f0c35a; --r2: #fbeab4; --r3: #9bd48f; --r4: #4f9a48; --glow: rgba(240, 195, 90, .4); --glow0: rgba(240, 195, 90, 0); }
.ring .halo { inset: -12%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow0) 46%, var(--glow) 70%, var(--glow0) 100%); animation: rg-breathe 5.5s ease-in-out infinite; }
.ring .lit { inset: 16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 252, 240, .85) 0, rgba(255, 252, 240, 0) 100%); animation: rg-breathe 5.5s ease-in-out -2.7s infinite; }
.ring .rg, .ring .cm { inset: 3%; border-radius: 50%;
  -webkit-mask: radial-gradient(closest-side, rgba(0, 0, 0, 0) calc(72% - .6px), #000 calc(72% + .4px), #000 calc(100% - 1px), rgba(0, 0, 0, 0) 100%);
  mask: radial-gradient(closest-side, rgba(0, 0, 0, 0) calc(72% - .6px), #000 calc(72% + .4px), #000 calc(100% - 1px), rgba(0, 0, 0, 0) 100%); will-change: transform; }
.ring .rg { background: conic-gradient(from 210deg, var(--r1), var(--r2) 14%, #a9cc6c 30%, var(--r3) 44%, var(--r4) 66%, var(--r3) 82%, #b4c95e 92%, var(--r1)); animation: rg-spin var(--t1, 18s) linear infinite; }
.ring .cm { background: conic-gradient(from 0deg, var(--cm0) 0, var(--cm0) 72%, var(--cm) 96%, var(--cm0) 100%); transform: rotate(40deg); animation: rg-spin2 var(--t2, 7s) linear infinite; }
@keyframes rg-spin { to { transform: rotate(360deg); } }
@keyframes rg-spin2 { from { transform: rotate(40deg); } to { transform: rotate(400deg); } }
@keyframes rg-breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
.ring[data-state=thinking] { --t1: 4s; --t2: 1.25s; }
.ring[data-state=thinking] .halo, .ring[data-state=thinking] .lit { animation-duration: 1.9s; }

/* ---------- E: flame ---------- */
.flame svg { inset: 0; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 90%; will-change: transform; }
.flame .gl { inset: -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 176, 72, .36) 0, rgba(240, 176, 72, .16) 55%, rgba(240, 176, 72, 0) 100%); transform: translateY(8%); animation: fl-glow 3.2s ease-in-out infinite; }
.flame .f1 { animation: fl-a var(--t1, 4.6s) ease-in-out infinite; }
.flame .f2 { animation: fl-b var(--t2, 3.4s) ease-in-out infinite; }
.flame .f3 { animation: fl-c var(--t3, 2.6s) ease-in-out infinite; }
@keyframes fl-a { 0%, 100% { transform: rotate(-2.2deg) scale(1, 1); } 50% { transform: rotate(2.4deg) scale(.975, 1.035); } }
@keyframes fl-b { 0%, 100% { transform: rotate(3deg) scale(1, .96); } 50% { transform: rotate(-3.4deg) scale(.96, 1.06); } }
@keyframes fl-c { 0%, 100% { transform: scale(1, 1); opacity: .95; } 50% { transform: scale(.93, 1.1); opacity: 1; } }
@keyframes fl-glow { 0%, 100% { opacity: .6; transform: translateY(8%) scale(.94); } 50% { opacity: 1; transform: translateY(8%) scale(1.05); } }
.flame[data-state=thinking] { --t1: 1.5s; --t2: 1.05s; --t3: .8s; }
.flame[data-state=thinking] .gl { animation-duration: 1.2s; }
.flame .in { transform-origin: 50% 90%; }

/* ---------- F: constellation ---------- */
.con { --nd: #2f5f2a; --nd2: #4f9444; --ln: rgba(43, 77, 36, .5); --gd: #e2a936; --gd2: #f8dc8a; --hal: rgba(226, 169, 54, .4); --hal0: rgba(226, 169, 54, 0); --lw: 2.3; }
.dk .con { --nd: #9bd48f; --nd2: #d3f0cb; --ln: rgba(155, 212, 143, .55); --gd: #f0c35a; --gd2: #fff0bd; --hal: rgba(240, 195, 90, .45); --hal0: rgba(240, 195, 90, 0); }
.con.sm { --lw: 3.2; }
.con .cw { inset: 0; animation: cn-sway 16s ease-in-out infinite; will-change: transform; }
.con svg { inset: 0; width: 100%; height: 100%; overflow: visible; }
.con svg line { stroke: var(--ln); stroke-width: var(--lw); stroke-linecap: round; }
.con .nd { width: var(--d); height: var(--d); margin: calc(var(--d) / -2); border-radius: 50%; background: radial-gradient(circle at 36% 30%, var(--nd2) 0, var(--nd) 70%); animation: cn-tw var(--tt, 4.8s) ease-in-out var(--dl, 0s) infinite; }
.con.sm .nd { width: calc(var(--d) * 1.25); height: calc(var(--d) * 1.25); margin: calc(var(--d) * -.625); }
.con .hub { background: radial-gradient(circle at 36% 30%, var(--gd2) 0, var(--gd) 72%); animation-name: cn-hub; }
.con .hl { left: 56%; top: 39%; width: .7em; height: .7em; margin: -.35em; border-radius: 50%; background: radial-gradient(closest-side, var(--hal) 0, var(--hal0) 100%); animation: cn-halo 4.8s ease-in-out infinite; }
.con .sp { left: 56%; top: 39%; width: .12em; height: .12em; margin: -.06em; border-radius: 50%; background: radial-gradient(closest-side, #fff8dc 0, var(--gd) 60%, var(--hal0) 100%); opacity: 0; }
@keyframes cn-sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@keyframes cn-tw { 0%, 100% { transform: scale(.82); opacity: .78; } 50% { transform: scale(1.08); opacity: 1; } }
@keyframes cn-hub { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1.1); } }
@keyframes cn-halo { 0%, 100% { transform: scale(.8); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
@keyframes cn-run { 0% { transform: translate(-.42em, .14em); opacity: 0; } 6% { opacity: 1; } 18% { transform: translate(-.24em, -.14em); } 36% { transform: translate(0, 0); } 50% { transform: translate(.26em, -.2em); } 64% { transform: translate(0, 0); } 80% { transform: translate(.14em, .32em); } 94% { opacity: 1; } 100% { transform: translate(-.16em, .42em); opacity: 0; } }
.con[data-state=thinking] { --tt: 1.2s; }
.con[data-state=thinking] .cw { animation-duration: 5s; }
.con[data-state=thinking] .sp { animation: cn-run 2.6s linear infinite; }
.con[data-state=thinking] .hl { animation-duration: 1.3s; }

@media (prefers-reduced-motion: reduce) {
  .mk, .mk * { animation: none !important; }
}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="fg1" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#f2b34c"/><stop offset=".5" stop-color="#e07a45"/><stop offset="1" stop-color="#b9492d"/></linearGradient>
    <linearGradient id="fg2" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#fbd774"/><stop offset=".6" stop-color="#f4b548"/><stop offset="1" stop-color="#ec9a42"/></linearGradient>
    <radialGradient id="fg3" cx=".5" cy=".62" r=".6"><stop offset="0" stop-color="#fffdf0"/><stop offset=".6" stop-color="#fdeeb4"/><stop offset="1" stop-color="#f9d778"/></radialGradient>
  </defs>
</svg>
<main class="grid" id="grid"></main>
<script>
(function () {
  var NODES = [[56, 39, .25, 1], [12, 54, .1], [31, 23, .145], [85, 17, .115], [71, 73, .155], [38, 84, .095]];
  var LINKS = [[1, 2], [2, 0], [0, 3], [0, 4], [4, 5]];
  function orb(k) { return '<i class="gl"></i><i class="in"><i class="bd"><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i><i class="sn"></i><i class="rm"></i></i></i>'; }
  function ring() { return '<i class="halo"></i><i class="in"><i class="lit"></i><i class="rg"></i><i class="cm"></i></i>'; }
  function flame() {
    return '<i class="gl"></i><i class="in">' +
      '<svg class="f1" viewBox="0 0 48 48"><path fill="url(#fg1)" d="M25.2 2.6c1.5 8.6 13.6 14.2 13.6 27.2C38.8 38.6 32.2 45 24 45S9.2 38.6 9.2 29.8c0-7.4 4.4-11.6 6.9-17.4 1.5 3 2.8 4.8 5 6.1-.2-6 1.6-11.200 4.1-15.900z"/></svg>' +
      '<svg class="f2" viewBox="0 0 48 48"><path fill="url(#fg2)" d="M24.6 17.500c1.200 6.300 8.200 9 8.200 16.300 0 5.200-3.900 9-8.800 9s-8.800-3.800-8.800-9c0-6.200 6.300-9.100 9.400-16.300z"/></svg>' +
      '<svg class="f3" viewBox="0 0 48 48"><path fill="url(#fg3)" d="M24.200 29.500c.9 3 4 4.300 4 7.600 0 2.500-1.900 4.300-4.200 4.300s-4.200-1.800-4.200-4.300c0-2.900 3.100-4.400 4.400-7.600z"/></svg></i>';
  }
  function con() {
    var s = '<i class="in"><i class="cw"><i class="hl"></i><svg viewBox="0 0 100 100">';
    LINKS.forEach(function (l) { var a = NODES[l[0]], b = NODES[l[1]]; s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; });
    s += '</svg>';
    NODES.forEach(function (n, i) { s += '<i class="nd' + (n[3] ? ' hub' : '') + '" style="left:' + n[0] + '%;top:' + n[1] + '%;--d:' + n[2] + 'em;--dl:' + (-i * .7) + 's"></i>'; });
    return s + '<i class="sp"></i></i></i>';
  }
  var KIND = {
    A: ['orb orb-a', orb], B: ['orb orb-b', orb], C: ['orb orb-c', orb],
    D: ['ring', ring], E: ['flame', flame], F: ['con', con]
  };
  function mark(id, state, size) {
    var k = KIND[id];
    return '<span class="mk ' + k[0] + (size <= 30 ? ' sm' : '') + '" data-state="' + state + '" style="--s:' + size + 'px" aria-hidden="true">' + k[1]() + '</span>';
  }
  var hour = new Date().getHours();
  var ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 5.500h14v10H10.500L6.500 19v-3.500H5z"/></svg>';
  var ICON_BARS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 19h14M8 16v-5M12 16V6M16 16v-8"/></svg>';
  var OPTIONS = [['A', 'Green into gold'], ['B', 'Terracotta ember'], ['C', 'Pearl, green core'], ['D', 'Ring of light'], ['E', 'Steady flame'], ['F', 'Small constellation']];
  document.getElementById('grid').innerHTML = OPTIONS.map(function (o) {
    var id = o[0];
    return '<section class="card" id="opt-' + id + '"><header><span class="ltr">' + id + '</span><h2>' + o[1] + '</h2></header>' +
      '<div class="start">' + mark(id, 'idle', 96) + '<h1>Good afternoon, Will</h1></div>' +
      '<div class="row2"><div class="hd"><span class="tile">' + mark(id, 'idle', 28) + '</span><span class="ttl">Favor Brain</span></div>' +
      '<div class="tb dk"><span class="tab">' + ICON_CHAT + 'Chat</span><span class="tab on">' + mark(id, 'idle', 24) + 'Brain</span><span class="tab">' + ICON_BARS + 'Reporting</span></div></div>' +
      '<div class="think">' + mark(id, 'thinking', 24) + '<span>Looking at the records</span></div>' +
      '<div class="states">' + ['idle', 'thinking', 'answered'].map(function (s) { return '<figure>' + mark(id, s, 56) + '<figcaption>' + s + '</figcaption></figure>'; }).join('') + '</div></section>';
  }).join('');
})();
</script>
